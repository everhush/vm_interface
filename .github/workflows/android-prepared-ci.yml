name: Pinned Android native inputs (no KVM)
on:
  push:
    branches: ['prep/android-prepared-ci']
  workflow_dispatch:
permissions:
  contents: read
  attestations: read
concurrency:
  group: vm-interface-android-prepared-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    if: github.repository == 'everhush/vm_interface'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install image inspection tool only if absent
        run: |
          command -v qemu-img >/dev/null || { sudo timeout 240s apt-get update -qq && sudo timeout 240s apt-get install -y --no-install-recommends qemu-utils; }
      - name: Verify actual pinned two-disk release and signed challenge APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/qualify-android-media.sh qualification/android --retain-disks
          node scripts/prepared-android.ts qualification/android --preflight-only > qualification/android/preflight.json
          node scripts/prepared-android.ts qualification/android --preflight-only --transfer adb-saf --authorize-android-debug > qualification/android/adb-preflight.json
          node -e 'const p=JSON.parse(require("node:fs").readFileSync("qualification/android/preflight.json","utf8"));require("node:assert/strict").ok(p.localInputsVerified===true&&p.guestCompatibilityVerified===false);console.log(JSON.stringify(p,null,2))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-android-prepared-inputs
          path: |
            qualification/android/*
            !qualification/android/disks/**
          retention-days: 30
