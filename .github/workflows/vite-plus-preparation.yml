name: Prepare Vite+ migration lock and formatting (not qualification)
on:
  push:
    branches: ['prep/vite-plus-migration']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vite-plus-preparation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    if: github.repository == 'everhush/vm_interface' && github.ref == 'refs/heads/prep/vite-plus-migration'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      generated: ${{ steps.retain.outputs.generated }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve pinned toolchain lock on the public standard runner
        run: |
          set -euo pipefail
          node -e 'const [major,minor]=process.versions.node.split(".").map(Number); if(major!==24||minor<11)throw new Error("Node 24.11+ required")'
          npm view vite-plus@1.8.0 dependencies.vite dependencies.vitest --json
          npm install --package-lock-only --no-audit --no-fund
          npm ci --no-audit --no-fund
          ./node_modules/.bin/vp toolchain
      - name: Format candidate and retain reviewable changes
        run: npm run fmt
      - name: Retain generated patch and lock
        id: retain
        run: |
          set -euo pipefail
          mkdir -p /tmp/vite-plus-review
          git rev-parse HEAD > /tmp/vite-plus-review/source-commit.txt
          git diff --binary HEAD > /tmp/vite-plus-review/generated.patch
          cp package-lock.json /tmp/vite-plus-review/package-lock.json
          sha256sum package-lock.json > /tmp/vite-plus-review/lock-sha256.txt
          echo 'generated=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: vite-plus-preparation-review
          path: /tmp/vite-plus-review/
          if-no-files-found: error
          retention-days: 7
      - name: Install evidence test dependencies
        run: bash scripts/install-evidence-tools.sh
      - name: Preliminary checks on generated working tree
        run: |
          set +e
          npm run check; checks=$?
          npm test; tests=$?
          npm run build; build=$?
          node scripts/check-source-migration.ts; guard=$?
          syntax=0
          for f in scripts/*.sh showcases/android/*.sh; do bash -n "$f" || syntax=1; done
          printf 'check=%s test=%s build=%s guard=%s shell=%s\n' "$checks" "$tests" "$build" "$guard" "$syntax"
          test "$checks$tests$build$guard$syntax" = 00000
  stage-generated:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.outputs.generated == 'true' && github.repository == 'everhush/vm_interface' && github.ref == 'refs/heads/prep/vite-plus-migration' }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: vite-plus-preparation-review
          path: ${{ runner.temp }}/vite-plus-review
      - name: Stage generated files on a separate unqualified branch
        env:
          REVIEW_DIR: ${{ runner.temp }}/vite-plus-review
        run: |
          set -euo pipefail
          test "$(cat "$REVIEW_DIR/source-commit.txt")" = "$GITHUB_SHA"
          (cd "$REVIEW_DIR" && sha256sum -c lock-sha256.txt)
          git apply --check --index "$REVIEW_DIR/generated.patch"
          git apply --index "$REVIEW_DIR/generated.patch"
          cmp package-lock.json "$REVIEW_DIR/package-lock.json"
          git diff --cached --check
          git diff --cached --quiet -- .github/workflows infra || { echo 'Generated changes must not modify workflows or infrastructure manifests'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Stage generated Vite+ lock and formatting; qualification pending'
          git push origin HEAD:refs/heads/prep/vite-plus-generated
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
