name: API and real KVM smoke
on:
  push:
    branches: ['implementation/**']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: vm-interface-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    if: github.repository == 'everhush/vm_interface'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bash scripts/install-evidence-tools.sh
      - run: bash scripts/device-validate.sh checks
        env:
          VM_STATIC_TEST_REPORT: ${{ runner.temp }}/vm-interface-test-report.json
      - name: Retain exact static test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-test-report
          path: ${{ runner.temp }}/vm-interface-test-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Retain resolved dependency lock for reproducibility review
        if: always() && hashFiles('package-lock.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: resolved-npm-lock
          path: package-lock.json
          retention-days: 7
  kvm:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Recover space on fresh GitHub-hosted runner only
        run: |
          bash scripts/reclaim-hosted-runner-space.sh
          bash scripts/install-oci-tools.sh
      - name: Provision isolated K3s with actual KVM
        run: |
          bash scripts/provision-ci.sh
          node scripts/check-runner-space.ts after-provision 12
      - name: Build and deploy
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-oci.sh k3s
          node scripts/check-runner-space.ts after-build 10
          A=$(openssl rand -hex 32); B=$(openssl rand -hex 32)
          echo "::add-mask::$A"; echo "::add-mask::$B"
          echo "TOKEN_A=$A" >> "$GITHUB_ENV"; echo "TOKEN_B=$B" >> "$GITHUB_ENV"
          kubectl -n vm-interface create secret generic vm-api-test --from-literal=identities="{\"alpha\":\"$A\",\"beta\":\"$B\"}"
          EXPORT_TOKEN=$(openssl rand -hex 32); echo "::add-mask::$EXPORT_TOKEN"
          kubectl -n vm-interface create secret generic vm-api-export --from-literal=token="$EXPORT_TOKEN"
          unset EXPORT_TOKEN
          umask 077
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" -keyout /tmp/console-tls.key -out /tmp/console-tls.crt
          kubectl -n vm-interface create secret tls vm-console-tls --key=/tmp/console-tls.key --cert=/tmp/console-tls.crt
          rm -f /tmp/console-tls.key
          chmod 644 /tmp/console-tls.crt
          kubectl apply -f infra/app.yaml
          kubectl -n vm-interface rollout status deployment/vm-api --timeout=300s
          node scripts/check-rbac-ci.ts
      - name: API smoke and tenant isolation
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        run: bash scripts/run-api-tests-ci.sh node scripts/e2e-smoke.ts
      - name: Persistent system and exchange lifecycle
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        run: bash scripts/run-api-tests-ci.sh node scripts/e2e-persistent.ts
      - name: Independent data disk lifecycle, media and native export
        id: data_disks
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        run: bash scripts/run-api-tests-ci.sh node scripts/e2e-data-disks.ts
      - name: Retain data disk partial evidence immediately on failed stage
        if: ${{ !cancelled() && steps.data_disks.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: disk-partial-evidence
          path: |
            evidence/data-disks*.json*
            evidence/api-test-stages.txt
            evidence/api-relay.log
          if-no-files-found: warn
          retention-days: 7
      - name: Install locked client dependencies and evidence tools
        id: client_tools
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        run: |
          npm ci --no-audit --no-fund
          bash scripts/install-evidence-tools.sh
      - name: Linux installation, archive, native clone and original recording
        id: linux_proof
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' && steps.client_tools.outcome == 'success' }}
        run: bash scripts/run-api-tests-ci.sh node scripts/e2e-api-functional-proof.ts
      - name: Retain linux-partial-evidence immediately on failed stage
        if: ${{ !cancelled() && steps.linux_proof.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-partial-evidence
          path: |
            evidence/api-functional-proof/
            evidence/api-test-stages.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Actual CDI disk import
        id: media_proof
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        run: bash scripts/run-api-tests-ci.sh bash scripts/e2e-media-ci.sh
      - name: Retain media-partial-evidence immediately on failed stage
        if: ${{ !cancelled() && steps.media_proof.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: media-partial-evidence
          path: |
            evidence/media-*-verification.json
            evidence/media-*-http.jsonl
            evidence/imported-disk-*-display.png
            evidence/public-image-*.json
            evidence/registered-artifact-verification.json
            evidence/api-test-stages.txt
            evidence/api-relay.log
          if-no-files-found: warn
          retention-days: 7
      - name: Actual authorized ISO import and boot configuration
        id: iso_proof
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        run: bash scripts/run-api-tests-ci.sh bash scripts/e2e-iso-ci.sh
      - name: Retain iso-partial-evidence immediately on failed stage
        if: ${{ !cancelled() && steps.iso_proof.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: iso-partial-evidence
          path: |
            evidence/iso-*.png
            evidence/iso-*.txt
            evidence/iso-*.json
            evidence/api-test-stages.txt
            evidence/api-relay.log
          if-no-files-found: warn
          retention-days: 7
      - name: Actual VNC transport
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' && steps.client_tools.outcome == 'success' }}
        run: bash scripts/run-api-tests-ci.sh node --import vite-plus/register scripts/e2e-vnc.ts
      - name: Original API control recording
        id: control_proof
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' && steps.client_tools.outcome == 'success' }}
        run: bash scripts/run-api-tests-ci.sh node scripts/e2e-api-control-proof.ts
      - name: Retain control partial evidence immediately on failed stage
        if: ${{ !cancelled() && steps.control_proof.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: control-partial-evidence
          path: |
            evidence/api-control-proof/
            evidence/api-test-stages.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Input ownership, pointer and keyboard isolation
        id: input_proof
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' && steps.client_tools.outcome == 'success' }}
        run: bash scripts/run-api-tests-ci.sh node --import vite-plus/register scripts/e2e-input.ts
      - name: Retain input-partial-evidence immediately on failed stage
        if: ${{ !cancelled() && steps.input_proof.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: input-partial-evidence
          path: |
            evidence/input-*.png
            evidence/input-*-marker-diagnostic.json
            evidence/reset-*-marker-diagnostic.json
            evidence/reset-*.png
            evidence/input-ownership.json
            evidence/reset-verification.json
            evidence/api-test-stages.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Private network isolation and tunnel
        id: network_proof
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' && steps.client_tools.outcome == 'success' }}
        run: bash scripts/run-api-tests-ci.sh node --import vite-plus/register scripts/e2e-network.ts
      - name: Retain network partial evidence immediately on failed stage
        if: ${{ !cancelled() && steps.network_proof.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: network-partial-evidence
          path: |
            evidence/network-http.jsonl
            evidence/network-guest-response.txt
            evidence/network-relay-response.txt
            evidence/network-verification.json
            evidence/api-test-stages.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Recording API lifecycle and authorization
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' && steps.client_tools.outcome == 'success' }}
        run: bash scripts/run-api-tests-ci.sh node --import vite-plus/register scripts/e2e-recording.ts
      - name: Actual guest VirtioFS exchange and published bundle
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        run: bash scripts/run-api-tests-ci.sh node scripts/e2e-exchange.ts
      - name: Idle-stop semantics
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        run: bash scripts/run-api-tests-ci.sh node scripts/e2e-idle.ts
      - name: Verify durable API recovery across deployment restart
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        run: |
          set -euo pipefail
          kubectl -n vm-interface port-forward svc/vm-api 3000:3000 > /tmp/recovery-port.log 2>&1 &
          port_pid=$!
          trap 'kill "$port_pid" 2>/dev/null || true; rm -f /tmp/vm-recovery.json' EXIT
          curl --retry 20 --retry-delay 2 --retry-connrefused --fail http://127.0.0.1:3000/api/v1/health
          node scripts/e2e-recovery.ts before
          kill "$port_pid" 2>/dev/null || true
          # Infrastructure fault injection only: guest lifecycle stays owned by KubeVirt.
          kubectl -n vm-interface rollout restart deployment/vm-api
          kubectl -n vm-interface rollout status deployment/vm-api --timeout=300s
          kubectl -n vm-interface port-forward svc/vm-api 3000:3000 > /tmp/recovery-port.log 2>&1 &
          port_pid=$!
          curl --retry 20 --retry-delay 2 --retry-connrefused --fail http://127.0.0.1:3000/api/v1/health
          node scripts/e2e-recovery.ts after
      - name: VirtioFS guest compatibility probe (infrastructure only)
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        run: |
          set -euo pipefail
          if ! command -v skopeo >/dev/null; then sudo apt-get update && sudo apt-get install -y skopeo; fi
          node scripts/probe-virtiofs-ci.ts
      - name: Independently verify actual network evidence
        if: ${{ !cancelled() && steps.network_proof.outcome == 'success' }}
        run: node scripts/verify_network_evidence.ts --root evidence --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" | tee evidence/network-independent-verification.json
      - name: Independently verify actual media evidence
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' && steps.client_tools.outcome == 'success' }}
        run: node scripts/verify_media_evidence.ts --root evidence --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" | tee evidence/media-evidence-verification.json
      - name: Verify original API-recorded evidence
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' && steps.client_tools.outcome == 'success' }}
        run: node scripts/verify-evidence.ts --root evidence --profile core --commit "$GITHUB_SHA" | tee evidence/video-evidence-verification.json
      - name: Diagnostics (no secret or implicit guest screen collection)
        if: always()
        run: |
          mkdir -p evidence
          kubectl get nodes -o wide > evidence/nodes.txt 2>&1 || true
          kubectl -n vm-interface get vm,vmi,pods > evidence/state.txt 2>&1 || true
          kubectl -n vm-interface get dv,pvc > evidence/storage-state.txt 2>&1 || true
          kubectl -n vm-interface get events --sort-by=.lastTimestamp > evidence/events.txt 2>&1 || true
          kubectl -n vm-interface logs deployment/vm-api -c api --tail=200 > evidence/api.log 2>&1 || true
          kubectl -n vm-interface logs deployment/vm-api -c console --tail=100 > evidence/console-gateway.log 2>&1 || true
          kubectl -n vm-interface logs deployment/vm-api -c recording --tail=100 > evidence/recording-worker.log 2>&1 || true
          kubectl -n vm-interface logs deployment/vm-api -c reconcile --tail=100 > evidence/operation-reconciler.log 2>&1 || true
          kubectl -n kubevirt get pods > evidence/kubevirt.txt 2>&1 || true
          kubectl -n kubevirt logs daemonset/virt-handler --tail=200 > evidence/virt-handler.log 2>&1 || true
          kubectl -n kubevirt logs deployment/virt-controller --tail=200 > evidence/virt-controller.log 2>&1 || true
          kubectl -n kubevirt get kubevirt kubevirt -o jsonpath='{.spec.configuration.developerConfiguration.disabledFeatureGates}' > evidence/kubevirt-feature-gates.txt 2>&1 || true
          kubectl get nodes -o custom-columns=NAME:.metadata.name,KVM:.status.allocatable.devices\\.kubevirt\\.io/kvm > evidence/kvm-capacity.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kvm-smoke-evidence
          path: evidence/
