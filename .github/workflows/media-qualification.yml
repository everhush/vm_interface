name: Pinned showcase media qualification (no KVM)
on:
  push:
    branches: ['prep/media-qualification-v2', 'prep/showcase-scenarios-v2']
  workflow_dispatch:
permissions:
  contents: read
  attestations: read
  actions: read
concurrency:
  group: vm-interface-media-qualification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-media:
    if: github.repository == 'xad3play/vm_interface' && github.ref_name == 'prep/media-qualification-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install image inspection tool
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends qemu-utils
      - name: Verify pinned image and build signed fixture APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/qualify-android-media.sh qualification/android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-media-qualification
          path: qualification/android/
          retention-days: 7
  windows-catalog:
    if: github.repository == 'xad3play/vm_interface' && github.ref_name == 'prep/media-qualification-v2'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact driver catalog and covered files without installing them
        shell: pwsh
        run: ./scripts/qualify-windows-catalog.ps1 -Output qualification/catalog
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-catalog-qualification
          path: qualification/catalog/
          retention-days: 7
  catalog-iso:
    needs: windows-catalog
    if: github.repository == 'xad3play/vm_interface' && github.ref_name == 'prep/media-qualification-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: windows-catalog-qualification
          path: qualification/catalog
      - name: Install ISO tooling
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends xorriso
      - name: Package only pinned signed files and verify ISO readback
        run: bash scripts/qualify-catalog-iso.sh qualification/catalog/driver-catalog-report.json qualification/iso
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-catalog-iso-qualification
          path: qualification/iso/
          retention-days: 7
  android-apk:
    if: github.repository == 'xad3play/vm_interface' && github.ref_name == 'prep/showcase-scenarios-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and inspect updated proof APK
        run: |
          set -euo pipefail
          mkdir -p qualification/apk
          bash showcases/android/build-apk.sh qualification/apk/proof.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs qualification/apk/proof.apk > qualification/apk/signature.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging qualification/apk/proof.apk > qualification/apk/badging.txt
          grep -F "versionName='2.0'" qualification/apk/badging.txt
          python3 scripts/write-showcase-scenario.py windows qualification/apk/windows-scenario.json
          python3 scripts/write-showcase-scenario.py android qualification/apk/android-scenario.json
          PYTHONPATH=scripts python3 -c 'from pathlib import Path; from showcase_inputs import load_scenario; [load_scenario(Path("qualification/apk/"+p+"-scenario.json"),p) for p in ("windows","android")]'
          (cd qualification/apk; sha256sum proof.apk *-scenario.json > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: showcase-apk-and-scenarios
          path: qualification/apk/
          retention-days: 30
