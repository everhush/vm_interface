name: Consolidated device candidate static checks
on:
  push:
    branches: ['prep/device-validation']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: device-candidate-static
  cancel-in-progress: true
jobs:
  checks:
    if: github.repository == 'xad3play/vm_interface'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr fonts-dejavu-core
      - run: bash scripts/device-validate.sh checks
      - name: Retain resolved dependency lock for reproducibility review
        if: always() && hashFiles('package-lock.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: resolved-npm-lock
          path: package-lock.json
          retention-days: 7
