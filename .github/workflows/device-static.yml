name: Consolidated device candidate static checks
on:
  push:
    branches: ['prep/device-validation', 'prep/issue-12-consolidated', 'prep/linux-showcase', 'prep/kubernetes-typescript']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: device-candidate-static
  cancel-in-progress: true
jobs:
  checks:
    if: github.repository == 'everhush/vm_interface'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bash scripts/install-evidence-tools.sh
      - run: bash scripts/device-validate.sh checks
      - name: Retain resolved dependency lock for reproducibility review
        if: always() && hashFiles('package-lock.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: resolved-npm-lock
          path: package-lock.json
          retention-days: 7
