name: Consolidated device candidate static checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'readme.md'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: device-candidate-static-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    if: github.repository == 'everhush/vm_interface'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bash scripts/install-evidence-tools.sh
      - run: bash scripts/device-validate.sh checks
        env:
          VM_STATIC_TEST_REPORT: ${{ runner.temp }}/vm-interface-test-report.json
      - name: Retain exact static test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-test-report
          path: ${{ runner.temp }}/vm-interface-test-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Retain resolved dependency lock for reproducibility review
        if: always() && hashFiles('package-lock.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: resolved-npm-lock
          path: package-lock.json
          retention-days: 7
