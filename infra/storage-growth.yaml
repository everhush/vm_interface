  namespace: vm-interface
subjects:
- kind: ServiceAccount
  name: vm-api
  namespace: vm-interface
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vm-api-pvc-growth
) && object.spec.resources.requests['storage'] in ['2Gi','3Gi','4Gi'] ||
       oldObject.metadata.name.matches('-data-[a-z0-9]([a-z0-9-]{0,14}[a-z0-9])?$') && object.spec.resources.requests['storage'] in ['2Gi','3Gi','4Gi','5Gi','6Gi','7Gi','8Gi'])
    message: "Only bounded monotonic storage-request increases on vm-expandable are permitted"
