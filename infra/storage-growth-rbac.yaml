# Apply only after vm-pvc-growth admission is demonstrably enforcing.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vm-api-pvc-growth
  namespace: vm-interface
rules:
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vm-api-pvc-growth
  namespace: vm-interface
subjects:
- kind: ServiceAccount
  name: vm-api
  namespace: vm-interface
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vm-api-pvc-growth
